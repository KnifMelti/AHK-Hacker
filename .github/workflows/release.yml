name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir -p AHK-Hacker-release/lib
          cp AHK-Hacker.ahk AHK-Hacker-release/
          cp AHK-Hacker.exe AHK-Hacker-release/
          cp Install-ContextMenu.ahk AHK-Hacker-release/
          cp Uninstall-ContextMenu.ahk AHK-Hacker-release/
          cp Update-ResourceHacker.ahk AHK-Hacker-release/
          cp RH.ico AHK-Hacker-release/
          cp README.md AHK-Hacker-release/
          cp lib/ResourceHacker4.exe AHK-Hacker-release/lib/

      - name: Create release archive
        run: |
          cd AHK-Hacker-release
          zip -r ../AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## AHK-Hacker v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download and extract `AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip`
            2. Run `Install-ContextMenu.ahk` to enable right-click menu integration
            3. (Optional) Run `Update-ResourceHacker.ahk` to download ResourceHacker 5.x

            ### What's Included
            - **AHK-Hacker.exe** / **AHK-Hacker.ahk** - Main decompiler (signed executable + source)
            - **Install-ContextMenu.ahk** - Context menu installer
            - **Uninstall-ContextMenu.ahk** - Context menu remover
            - **Update-ResourceHacker.ahk** - ResourceHacker 5.x updater
            - **lib/ResourceHacker4.exe** - Bundled legacy version for older AHK formats
            - **RH.ico** - Application icon
            - **README.md** - Documentation

            ### What's Changed
            See commit history below.
          files: |
            AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
