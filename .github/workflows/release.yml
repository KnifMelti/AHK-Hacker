name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Preserve line endings as stored in repository (CRLF)
          # This ensures .gitattributes settings are respected
          lfs: false

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify line endings (CRLF should be preserved)
        run: |
          echo "Verifying line endings in checked-out files..."
          file -b src/AHK-Hacker.ahk src/Install.ahk README.md
          echo "All files should show 'CRLF line terminators'"

      - name: Prepare release files
        run: |
          mkdir -p AHK-Hacker/lib

          # Copy all src/ contents to release root (flat structure)
          cp src/*.ahk AHK-Hacker/
          cp src/*.exe AHK-Hacker/
          cp src/res/AH.ico AHK-Hacker/

          # Copy lib/
          cp src/lib/*.ahk AHK-Hacker/lib/

      - name: Create release archive
        run: |
          # Note: zip preserves line endings as-is from source files
          # Files are checked out with CRLF per .gitattributes
          zip -r AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip AHK-Hacker/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |

            **Installation:**
            1. Download and extract `AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip`
            2. Double-click `Install.ahk`
            3. Click OK to proceed with installation

            See [README.md](README.md) for details.
          files: |
            AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true

