name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Preserve line endings as stored in repository (CRLF)
          # This ensures .gitattributes settings are respected
          lfs: false

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify line endings (CRLF should be preserved)
        run: |
          echo "Verifying line endings in checked-out files..."
          file -b AHK-Hacker.ahk Install.ahk README.md
          echo "All files should show 'CRLF line terminators'"

      - name: Prepare release files
        run: |
          mkdir -p AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib
          mkdir -p AHK-Hacker-v${{ steps.version.outputs.VERSION }}/bin

          # Root files
          cp AHK-Hacker.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp AHK-Hacker.exe AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp Install.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp Uninstall.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp res/RH.ico AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp README.md AHK-Hacker-v${{ steps.version.outputs.VERSION }}/

          # lib/ folder - helper scripts
          cp lib/Notifications.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib/
          cp lib/Install-ContextMenu.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib/
          cp lib/Uninstall-ContextMenu.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib/
          cp lib/Update-ResourceHacker.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib/
          cp lib/Unpack-Exe.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib/

          # bin/ folder - bundled ResourceHacker4.exe
          cp res/ResourceHacker4.exe AHK-Hacker-v${{ steps.version.outputs.VERSION }}/bin/

      - name: Create release archive
        run: |
          # Note: zip preserves line endings as-is from source files
          # Files are checked out with CRLF per .gitattributes
          zip -r AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip AHK-Hacker-v${{ steps.version.outputs.VERSION }}/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |

            **Installation:**
            1. Download and extract the zip file
            2. Double-click `Install.ahk`
            3. Click OK to proceed with installation

            See [README.md](README.md) for details.
          files: |
            AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true

