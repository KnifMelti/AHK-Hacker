name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          mkdir -p AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib
          cp AHK-Hacker.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp AHK-Hacker.exe AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp Install-ContextMenu.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp Uninstall-ContextMenu.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp Update-ResourceHacker.ahk AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp Install.ps1 AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp RH.ico AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp README.md AHK-Hacker-v${{ steps.version.outputs.VERSION }}/
          cp lib/ResourceHacker4.exe AHK-Hacker-v${{ steps.version.outputs.VERSION }}/lib/

      - name: Create release archive
        run: |
          zip -r AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip AHK-Hacker-v${{ steps.version.outputs.VERSION }}/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            AutoHotkey decompiler with Windows context menu integration.

            **Quick Start:**
            1. Download and unblock the zip file
            2. Extract folder and run `Install.ps1` (PowerShell) or `Install-ContextMenu.ahk`

            See [README.md](README.md) for full instructions.
          files: |
            AHK-Hacker-v${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
